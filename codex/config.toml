# Codex configuration for the VGV AI Flutter Plugin.
#
# This is the `~/.codex/config.toml` equivalent of the repository-root `.mcp.json`
# that Claude Code reads. `codex/install.sh` applies all of it for you through the
# supported `codex mcp add` and `codex features enable` commands, which merge into
# an existing config instead of replacing it. Merge it by hand only if you would
# rather not run the installer.

# The Dart and Flutter MCP server ships with the Dart SDK. The `cli` feature
# category is off by default, so `dart_format` has to be enabled explicitly —
# the `green-gate` skill's format gate calls that tool. Test execution stays
# disabled on purpose; the Very Good CLI `test` tool is used instead.
[mcp_servers.dart]
command = "dart"
args = ["mcp-server", "--enable", "dart_format"]

# Very Good CLI >= 1.3.0 must be on your PATH:
#   dart pub global activate very_good_cli
[mcp_servers.very-good-cli]
command = "very_good"
args = ["mcp"]

# Hooks are stable and enabled by default in Codex. Pinning the flag here only
# matters if something in your config or profile previously set it to false.
[features]
hooks = true
