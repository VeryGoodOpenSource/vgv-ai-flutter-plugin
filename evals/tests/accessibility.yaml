# =============================================================================
# accessibility — behaviour cases
# =============================================================================
#
# GRADING NOTES
#   Mixed grading. Cases 5 and 6 are graded on the artifact — they ask for a widget
#   class and carry dart-parses. Cases 1 to 4 are graded on what the response narrates:
#   the question it asks, the report it writes, the request it declines.
#
#   Prompts name no skill, so `skill-used` catches a routing failure directly.
#
#   Prompts are self-contained. The fixture has no source in lib/, so a prompt about
#   "my SettingsView" earns a refusal and every grader fails for an unrelated reason.
#   The widget under audit is pasted in.
#
#   Phases 1 and 2 of the workflow call `AskUserQuestion`, which neither provider
#   exposes (`tools` is Skill/Read/Glob/Grep). So the level-and-platform gate is graded
#   on the question the response *narrates* in text, not on a tool call — the same
#   treatment the MCP-backed skills get.
#
#   Most cases state the WCAG level and the platforms up front. Without them the skill
#   correctly stops at Phase 1 and asks, which would leave nothing to grade in the
#   remediation cases. Exactly one case (1) omits them on purpose, to grade the gate.
#
#   WCAG criterion IDs are graded mechanically (`2.5.8`, `2.1.1`, ...) because Core
#   Standards pins a specific ID to each rule, and the sealed column tends to answer in
#   generic "add a label" prose without citing WCAG 2.2 at all.
#
#   Of the cases whose answer carries Dart, three (2, 3, 4) omit `dart-parses` on
#   purpose and each says so at the case.
#   The assertion requires every ```dart block to parse standalone or wrapped in a
#   function body, so a report's `// Before` / `// After` fragments — bare widget
#   expressions with no trailing semicolon — fail it for reasons unrelated to
#   accessibility. Cases whose answer is a whole widget class keep the assertion.
#
# CASES
#   1  accessibility-asks-level-and-platform-before-auditing
#      Phase 1 + Phase 2 gate: no level and no platforms given, so it must ask first.
#   2  accessibility-audits-with-criterion-ids-and-severities
#      Audit report shape — WCAG ID + name, CRITICAL/MAJOR/MINOR, before/after fix.
#   3  accessibility-declines-gesture-detector-tap-target
#      Refuses a bare GestureDetector tap target when asked for one by name.
#   4  accessibility-declines-exclude-semantics-on-actionable-content
#      Refuses ExcludeSemantics and scopes MergeSemantics to the static pair only.
#   5  accessibility-wraps-cupertino-and-announces-on-ios
#      Cupertino semantic wrapper plus the iOS liveRegion announcement gotcha.
#   6  accessibility-adds-non-drag-alternative-to-dismissible
#      2.5.7: keeps the swipe and adds a labelled non-drag delete control.
#   7  accessibility-stays-out-of-plain-dart-work  [negative control]
#      Plain Dart formatter must not pull in the skill or its vocabulary.
#
# ASSERTION ORDER
#   Every case lists assertions in this order: routing, mechanical, syntax, judged.
# =============================================================================

# -----------------------------------------------------------------------------
# 1  accessibility-asks-level-and-platform-before-auditing
# -----------------------------------------------------------------------------
# MEASURES       The Phase 1 / Phase 2 gate. Level and platforms are withheld, so the
#                skill must ask both before auditing. SKILL.md: "Never assume AA" and
#                "Begin every audit by asking which of the six platforms are targeted".
# DISCRIMINATES  An unaided model assumes AA, audits the widget on the spot, and talks
#                about iOS and Android only. `AA + selected AAA` is verbatim from the
#                Phase 1 option list and is not phrasing a bare model volunteers.
- description: accessibility-asks-level-and-platform-before-auditing
  vars:
    prompt: >-
      Can you audit this widget for accessibility before we ship it?

        class PromoCard extends StatelessWidget {
          const PromoCard({required this.onTap, super.key});
          final VoidCallback onTap;

          @override
          Widget build(BuildContext context) {
            return GestureDetector(
              onTap: onTap,
              child: SizedBox(
                height: 20,
                child: Row(
                  children: [
                    Image.asset('assets/promo.png'),
                    const Text('50% off today'),
                  ],
                ),
              ),
            );
          }
        }
  assert:
    # routing
    - type: skill-used
      value: 'vgv-ai-flutter-plugin:accessibility'
    # mechanical
    - type: regex
      value: 'AA \+ selected AAA'
    # The six-platform list from Phase 2. Linux is the tell: an unaided answer talks
    # about iOS and Android, not about Orca on Linux desktop.
    - type: icontains
      value: 'linux'
    # judged
    - type: llm-rubric
      value: >-
        The response asks the reader which WCAG 2.2 conformance level is being
        targeted and presents the choice as a set of named options that includes A,
        AA, and AAA. A response that simply audits against AA without asking, or that
        states "assuming AA" and moves on, does not satisfy this.
    - type: llm-rubric
      value: >-
        The response also asks which platforms the app targets and names specific
        platforms as options, at minimum iOS, Android, Web, and at least one desktop
        platform (macOS, Windows, or Linux).

# -----------------------------------------------------------------------------
# 2  accessibility-audits-with-criterion-ids-and-severities
# -----------------------------------------------------------------------------
# MEASURES       Level and platforms are supplied, so the skill proceeds to Phase 3 and
#                must emit the report shape from references/audit-templates.md: per
#                finding a WCAG ID + name + level, a CRITICAL/MAJOR/MINOR severity from
#                the severity guide, and a before/after fix. The 16x16 close button is
#                the 2.5.8 Target Size (Minimum) violation; its GestureDetector is 2.1.1.
# DISCRIMINATES  An unaided model returns generic "add a label" prose with no WCAG 2.2
#                IDs, and grades severity as High/Medium/Low or axe-style
#                Serious/Moderate rather than the skill's three labels.
- description: accessibility-audits-with-criterion-ids-and-severities
  vars:
    prompt: >-
      We're targeting WCAG 2.2 level AA on iOS and Android. Audit this screen and
      report every finding.

        class OrderSummary extends StatelessWidget {
          const OrderSummary({required this.onClose, super.key});
          final VoidCallback onClose;

          @override
          Widget build(BuildContext context) {
            return Column(
              children: [
                Row(
                  children: [
                    Image.asset('assets/receipt.png'),
                    const Spacer(),
                    SizedBox(
                      width: 16,
                      height: 16,
                      child: GestureDetector(
                        onTap: onClose,
                        child: const Icon(Icons.close, size: 16),
                      ),
                    ),
                  ],
                ),
                const SizedBox(
                  height: 20,
                  child: Text('Delivery estimate: 3 to 5 business days'),
                ),
              ],
            );
          }
        }
  # No dart-parses: the answer is a report whose fixes are before/after fragments.
  assert:
    # routing
    - type: skill-used
      value: 'vgv-ai-flutter-plugin:accessibility'
    # mechanical
    - type: regex
      value: '2\.5\.8'
    - type: regex
      value: '2\.1\.1'
    # Upper-case severity labels are the skill's vocabulary, from the severity guide in
    # references/audit-templates.md.
    - type: regex
      value: 'CRITICAL'
    # judged
    - type: llm-rubric
      value: >-
        Every finding in the report carries a severity that is one of exactly
        CRITICAL, MAJOR, or MINOR, and cites a numeric WCAG criterion ID together
        with that criterion's name, for example "1.1.1 Non-text Content".
    - type: llm-rubric
      value: >-
        Each finding shows the fix as before-and-after Flutter code, not as prose
        advice alone.

# -----------------------------------------------------------------------------
# 3  accessibility-declines-gesture-detector-tap-target
# -----------------------------------------------------------------------------
# MEASURES       The skill's flagship prohibition: "Never use bare GestureDetector for
#                tap targets ... GestureDetector is pointer-only and unreachable via
#                keyboard or switch access." The prompt asks for it by name and supplies
#                a plausible excuse, so complying is the failure mode.
# DISCRIMINATES  An unaided model obliges the request, ships the GestureDetector version
#                as its recommendation with at most a passing caveat, and never cites
#                2.1.1 Keyboard as the criterion being broken.
- description: accessibility-declines-gesture-detector-tap-target
  vars:
    prompt: >-
      WCAG 2.2 AA, Android and iOS. I need a tappable card that opens the product
      details page. Use GestureDetector for the tap handling, since the card has
      custom padding and I don't want an ink splash on it. Show me the widget and
      say whether there's anything wrong with that approach.
  # No dart-parses: the rubric below expects the rejected GestureDetector to appear
  # as a "before" fragment, and a bare widget expression with no trailing semicolon
  # does not parse even wrapped in a function body.
  assert:
    # routing
    - type: skill-used
      value: 'vgv-ai-flutter-plugin:accessibility'
    # mechanical
    # The documented replacement list from the Gesture Detector core standard.
    - type: regex
      value: 'InkWell|ElevatedButton|TextButton|IconButton'
    - type: regex
      value: '2\.1\.1'
    # judged
    - type: llm-rubric
      value: >-
        The response refuses to use a bare GestureDetector as the tap target and
        gives the reason: GestureDetector is pointer-only, so the card is unreachable
        by keyboard or switch access. A response that supplies the GestureDetector
        version as its recommendation, with or without caveats, does not satisfy this.
    - type: llm-rubric
      value: >-
        The recommended widget uses InkWell or a Material button widget as the tap
        target. If GestureDetector appears anywhere in the response, it appears only
        as the rejected "before" or "wrong" version.

# -----------------------------------------------------------------------------
# 4  accessibility-declines-exclude-semantics-on-actionable-content
# -----------------------------------------------------------------------------
# MEASURES       Second prohibition — "Never use ExcludeSemantics on non-decorative
#                content" — plus the MergeSemantics correctness rule from
#                references/examples.md: merge the static label/value pair only and
#                keep the interactive child independently focusable.
# DISCRIMINATES  An unaided model either complies with the ExcludeSemantics request or
#                merges the whole Row, folding the button's role away.
# HISTORY        The pasted row used to hold a single `Text('Total: 42.00 USD')`, which
#                made the case unmeasurable two ways. Nothing was there to group, so the
#                alternative rubric asked for a pattern the widget could not carry — the
#                plugin column diagnosed the premise as false, asked for the parent
#                widget and failed that rubric. And the refusal alone is baseline
#                behaviour: the sealed column declined ExcludeSemantics, gave the reason
#                and cited 4.1.2 unaided. The row now carries a real label/value pair,
#                the exact shape references/examples.md marks CORRECT. The criterion-ID
#                regex is gone because it was a measured free point in both columns, and
#                criterion IDs are already graded in three other cases here.
- description: accessibility-declines-exclude-semantics-on-actionable-content
  vars:
    prompt: >-
      WCAG 2.2 AA on Android. TalkBack stops three times on this row: "Total", then
      "42.00 USD", then the button. The amount should be announced together with its
      label. Here it is:

        Row(
          children: [
            const Text('Total'),
            const Text('42.00 USD'),
            ElevatedButton(
              onPressed: _submit,
              child: const Text('Pay now'),
            ),
          ],
        )

      Fix it by wrapping the whole Row in ExcludeSemantics so the extra stops go away.
  # No dart-parses: both the pasted subject and the fix are bare Row expressions.
  assert:
    # routing
    - type: skill-used
      value: 'vgv-ai-flutter-plugin:accessibility'
    # mechanical
    # With the paren, so the fix has to arrive as code. The sealed column named
    # MergeSemantics in prose, as a possible cause rather than the fix.
    - type: regex
      value: 'MergeSemantics\('
    # judged
    - type: llm-rubric
      value: >-
        The response refuses to wrap the row in ExcludeSemantics and says that doing
        so strips the button from the semantics tree, leaving the action unreachable
        for screen reader users. Complying with the ExcludeSemantics request does not
        satisfy this.
    - type: llm-rubric
      value: >-
        The grouping covers only the two static Text children, so the label and the
        amount are announced as one node, while the ElevatedButton remains its own
        independently focusable node outside the grouping. A fix that puts the button
        inside the MergeSemantics, or that wraps the whole Row, does not satisfy this.

# -----------------------------------------------------------------------------
# 5  accessibility-wraps-cupertino-and-announces-on-ios
# -----------------------------------------------------------------------------
# MEASURES       iOS-specific remediation on two skill facts: the Cupertino Semantics
#                core standard ("Cupertino widgets ship with weaker semantic defaults
#                ... Always wrap them in Semantics(label:, value:, button:)") and the
#                iOS reference's gotcha that `liveRegion: true` does not auto-announce
#                on iOS (Flutter issue #45968), so SemanticsService.announce is required
#                as well.
# DISCRIMINATES  An unaided model adds liveRegion and treats it as sufficient, and
#                either leaves the CupertinoSwitch bare or swaps it for a Material
#                Switch instead of wrapping it.
- description: accessibility-wraps-cupertino-and-announces-on-ios
  vars:
    prompt: >-
      iOS-only app, WCAG 2.2 AA. This tile has a sync toggle plus a status line that
      updates when the upload finishes:

        class SyncTile extends StatelessWidget {
          const SyncTile({
            required this.enabled,
            required this.onChanged,
            required this.status,
            super.key,
          });

          final bool enabled;
          final ValueChanged<bool> onChanged;
          final String status;

          @override
          Widget build(BuildContext context) {
            return Row(
              children: [
                const Text('Sync photos'),
                CupertinoSwitch(value: enabled, onChanged: onChanged),
                Text(status),
              ],
            );
          }
        }

      Make it work properly with VoiceOver. Show the updated code and call out
      anything iOS-specific.
  assert:
    # routing
    - type: skill-used
      value: 'vgv-ai-flutter-plugin:accessibility'
    # mechanical
    - type: regex
      value: 'liveRegion'
    - type: regex
      value: 'SemanticsService\.announce'
    # syntax
    - type: javascript
      value: file://assertions/dart-parses.js
    # judged
    - type: llm-rubric
      value: >-
        The response states that on iOS a Semantics widget with liveRegion: true does
        not announce the change on its own, so SemanticsService.announce must also be
        called for VoiceOver to read the update. A response that only adds liveRegion
        and treats that as sufficient does not satisfy this.
    - type: llm-rubric
      value: >-
        The CupertinoSwitch is wrapped in a Semantics widget that supplies a label and
        the toggle's on/off state, and the response explains that Cupertino widgets
        have weaker semantic defaults than their Material equivalents. Leaving the
        CupertinoSwitch bare, or swapping it for a Material Switch instead of wrapping
        it, does not satisfy this.

# -----------------------------------------------------------------------------
# 6  accessibility-adds-non-drag-alternative-to-dismissible
# -----------------------------------------------------------------------------
# MEASURES       WCAG 2.2 2.5.7: "Every dragging-based function must offer a non-drag
#                alternative on the same screen. `Dismissible` needs an explicit delete
#                button." The pattern in references/examples.md keeps the Dismissible
#                and adds a tooltipped IconButton in the ListTile's trailing slot.
# DISCRIMINATES  Only the criterion ID separates the columns here. A bare model reaches
#                the Dismissible-plus-trailing-IconButton shape on its own but does not
#                name the criterion it is remediating; the skill does, everywhere.
# HISTORY        Measured: every assertion except the `2.5.7` regex passed with no
#                plugin loaded. An earlier version with only `IconButton` plus the
#                rubric let a response that deleted the swipe and shipped a button alone
#                score 0.8 and pass, so `Dismissible\(` grades that property a second
#                time. "Output Dart code only" still leaves a doc comment on the widget
#                class for the criterion ID to live in.
- description: accessibility-adds-non-drag-alternative-to-dismissible
  vars:
    prompt: >-
      WCAG 2.2 AA, Android and iOS. Swiping is currently the only way to remove an
      item from this list:

        Dismissible(
          key: ValueKey(item.id),
          direction: DismissDirection.endToStart,
          background: Container(color: Colors.red),
          onDismissed: (_) => _delete(item),
          child: ListTile(title: Text(item.name)),
        )

      Bring it up to conformance. Give me the whole list item as a widget class.
      Output Dart code only.
  assert:
    # routing
    - type: skill-used
      value: 'vgv-ai-flutter-plugin:accessibility'
    # mechanical
    - type: regex
      value: 'IconButton'
    # The reference pattern keeps the Dismissible and adds the button beside it, so the
    # swipe must survive the fix.
    - type: regex
      value: 'Dismissible\('
    # An icon-only control needs a Tooltip or Semantics label of its own (Icon
    # Buttons core standard, WCAG 4.1.2), so the alternative control must be named.
    - type: regex
      value: 'tooltip:|Semantics\('
    # Core Standards pins 2.5.7 to drag alternatives and references/examples.md titles
    # the pattern with it. This is the one assertion the sealed column misses.
    - type: regex
      value: '2\.5\.7'
    # syntax
    - type: javascript
      value: file://assertions/dart-parses.js
    # judged
    - type: llm-rubric
      value: >-
        The code keeps the swipe-to-dismiss behavior and additionally exposes a
        delete control that is visible without any drag or swipe, on the same list
        item — for example an IconButton in the ListTile's trailing slot. Code that
        only reveals a control after a swipe, or that removes the swipe and leaves no
        second path, does not satisfy this.

# -----------------------------------------------------------------------------
# 7  accessibility-stays-out-of-plain-dart-work  [negative control]
# -----------------------------------------------------------------------------
# MEASURES       Routing restraint. A pure Dart string formatter with no widgets in
#                sight must not pull the skill in. Nothing else catches a skill firing
#                where it should not.
# DISCRIMINATES  Must NOT appear: the skill in `skillCalls`, and any Semantics,
#                semanticLabel, WCAG, screen-reader or accessibility vocabulary in a
#                mm:ss formatter.
- description: accessibility-stays-out-of-plain-dart-work
  vars:
    prompt: >-
      Write a Dart function `String formatDuration(Duration d)` that renders a
      duration as mm:ss. No Flutter, no widgets. Return only the function.
  assert:
    # routing
    - type: not-skill-used
      value: 'vgv-ai-flutter-plugin:accessibility'
    # mechanical
    - type: not-regex
      value: 'Semantics|semanticLabel|WCAG|disableAnimations|excludeFromSemantics'
    - type: not-icontains
      value: 'accessibility'
    # Task success is graded mechanically, not by the judge. The judge never sees the
    # prompt, so "did it answer the question" is unanswerable from the output alone.
    - type: regex
      value: 'String formatDuration\(Duration'
    # judged
    - type: llm-rubric
      value: >-
        Judge only the text of the response, not whether the formatting logic is
        correct. It must not introduce accessibility, semantics, screen reader, or
        WCAG concepts.
