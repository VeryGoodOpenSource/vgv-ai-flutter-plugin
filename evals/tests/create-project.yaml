# =============================================================================
# create-project — behaviour cases
# =============================================================================
#
# GRADING NOTES
#   No MCP server is configured for these providers, so these cases grade the decisions
#   the skill drives — template inference, name normalization, what it declines — not
#   the create call. Only assert template names the SKILL.md teaches, never ones the MCP
#   server supplies at run time.
#
#   Consequence worth knowing before writing a case here: with no `create` tool the
#   skill cannot execute, and every response says so and hands the user a command to run
#   instead. Do not assert that the response *uses* the MCP tools — that is unsatisfiable
#   in this environment, and asserting it measured the harness rather than the skill.
#   Wiring the real server in is not the fix either: `create` would scaffold a project
#   into evals/fixture on every run.
#
#   Case 1 carries no `skill-used`, and that is deliberate — see its HISTORY line. Every
#   other case asserts routing.
#
#   Measured baseline, first full run: 5/6 with-skill against 0/6 sealed, negative
#   control excluded. See evals/README.md.
#
# CASES
#   1  create-project-infers-dart-package-for-api-client
#      Infers dart_package, not flutter_package, for an HTTP-only package.
#   2  create-project-asks-for-organization-when-required
#      Asks for the organization instead of letting the app template take a placeholder.
#   3  create-project-scopes-dependency-install-to-the-new-project
#      Scopes packages_get to the new project directory, and still asks for the org.
#   4  create-project-asks-when-the-template-is-ambiguous
#      Clarifies "a package" by asking what is being built, not which subcommand.
#   5  create-project-does-not-over-ask
#      Proceeds on name plus organization without interrogating for optionals.
#   6  create-project-plans-dependency-install
#      The narrated plan scaffolds via Very Good CLI and then installs dependencies.
#   7  create-project-stays-out-of-existing-project-work  [negative control]
#      Editing an existing class draws no scaffolding proposal.
#
# ASSERTION ORDER
#   Every case lists assertions in this order: routing, mechanical, syntax, judged.
# =============================================================================

# -----------------------------------------------------------------------------
# 1  create-project-infers-dart-package-for-api-client
# -----------------------------------------------------------------------------
# MEASURES       The template inference itself: a package with no Flutter dependency
#                takes dart_package, which is also the layered-architecture rule for
#                data and repository layers.
# DISCRIMINATES  A bare model reaches for flutter_package because the monorepo is a
#                Flutter one, or answers with prose instead of a template name.
# HISTORY        No `skill-used` on purpose. A one-word template question does not
#                activate the skill — measured at 0/2 with the answer correct both
#                times — so asserting routing here would only ever report the harness.
#                Routing is covered by the cases below that ask for scaffolding work.
#                "HTTP only, no Flutter widgets" is stated because the terser version
#                answered `flutter_package` on some runs.
- description: create-project-infers-dart-package-for-api-client
  vars:
    prompt: >-
      I need a weather API client package under packages/ in my Flutter monorepo. It
      does HTTP and JSON only, no Flutter widgets. Which Very Good CLI template
      should it use? Answer with only the template name, nothing else.
  assert:
    # (no routing assertion in this case — see HISTORY)
    # mechanical
    - type: icontains
      value: 'dart_package'
    - type: not-icontains
      value: 'flutter_package'

# -----------------------------------------------------------------------------
# 2  create-project-asks-for-organization-when-required
# -----------------------------------------------------------------------------
# MEASURES       Key Domain Knowledge: app, plugin and game templates require an
#                organization and silently take a placeholder when it is skipped, so the
#                skill asks for it instead of proceeding.
# DISCRIMINATES  A bare model invents com.example, or scaffolds with the placeholder
#                the template falls back to, and never raises the question.
- description: create-project-asks-for-organization-when-required
  vars:
    prompt: 'Create a Flutter app called my_store.'
  assert:
    # routing
    - type: skill-used
      value: 'vgv-ai-flutter-plugin:create-project'
      weight: 3
    # judged
    - type: llm-rubric
      value: >-
        The response asks for an organization name rather than proceeding without one
        or silently accepting a placeholder, because the template produces an app.

# -----------------------------------------------------------------------------
# 3  create-project-scopes-dependency-install-to-the-new-project
# -----------------------------------------------------------------------------
# MEASURES       The two-step order — create, then install — with the install scoped to
#                the created project via `directory`, plus the organization prompt.
# DISCRIMINATES  A bare model runs the install at the monorepo root, names `flutter
#                create`, and invents an organization without comment.
# HISTORY        Replaces an earlier `create-project-normalizes-dashed-project-name`
#                case, which asked what a dashed project name becomes. It scored 1.00
#                in *both* columns: snake_case Dart package names are common knowledge,
#                so the case measured Claude rather than the skill. This asks instead
#                about the two things a bare model cannot guess — the `packages_get`
#                tool and that its `directory` points at the new project.
#                The organization is deliberately withheld: with `for org com.example`
#                in the prompt there is no reason to discuss the requirement, and the
#                plugin column missed the final assertion on every run for asking about
#                something the prompt had already settled.
- description: create-project-scopes-dependency-install-to-the-new-project
  vars:
    prompt: >-
      I want to scaffold a new Flutter app named storefront, placed at apps/storefront
      inside my existing monorepo, and then install its dependencies. Which tools would
      you call, in order, and what arguments would you pass to each? Tell me anything
      you still need from me. Do not run anything yet.
  assert:
    # routing
    - type: skill-used
      value: 'vgv-ai-flutter-plugin:create-project'
      weight: 3
    # mechanical
    # Both surface forms count: the MCP tool is `packages_get`, the shell equivalent is
    # `very_good packages get`. An earlier `icontains: packages_get` failed a correct
    # answer that used the shell form, which tested syntax rather than knowledge.
    - type: regex
      value: 'packages[ _]get'
    # The load-bearing detail, in either form: `--directory apps/storefront` or
    # `directory: 'apps/storefront'`. This is the part a bare model does not know.
    - type: regex
      value: 'directory[^\n]{0,14}apps/storefront'
    - type: not-icontains
      value: 'flutter create'
    # judged
    - type: llm-rubric
      value: >-
        The dependency-install step is explicitly scoped to the newly created project
        directory, for example by passing a directory argument of `apps/storefront`. A
        response that installs dependencies without saying which directory they apply
        to, or that runs the install against the monorepo root, does not satisfy this.
    # Either asking for the org or flagging it as required satisfies this, so it does
    # not demand a specific phrasing.
    - type: llm-rubric
      value: >-
        The response does not silently invent an organization identifier. It either asks
        the user for the organization or flags it as required and not skippable for this
        template. Emitting a made-up value such as com.example with no comment fails.

# -----------------------------------------------------------------------------
# 4  create-project-asks-when-the-template-is-ambiguous
# -----------------------------------------------------------------------------
# MEASURES       That a genuinely ambiguous request gets a clarifying question, framed
#                around what the user is building rather than a subcommand name.
# DISCRIMINATES  A bare model picks a template and starts scaffolding, or asks "which
#                template do you want, dart_package or flutter_package?" — the exact
#                phrasing the skill's anti-pattern table rules out.
- description: create-project-asks-when-the-template-is-ambiguous
  vars:
    prompt: 'Create a new package for me.'
  assert:
    # routing
    - type: skill-used
      value: 'vgv-ai-flutter-plugin:create-project'
      weight: 3
    # judged
    - type: llm-rubric
      value: >-
        The response asks a clarifying question instead of guessing a template, because
        'a package' could be either a pure Dart package or a Flutter package.
    - type: llm-rubric
      value: >-
        The clarifying question is framed around what the user is building, not around
        which CLI subcommand or template name they want to type.

# -----------------------------------------------------------------------------
# 5  create-project-does-not-over-ask
# -----------------------------------------------------------------------------
# MEASURES       The other half of the asking rule: with name and organization in hand,
#                nothing optional gets interrogated.
# DISCRIMINATES  A bare model runs a questionnaire for description, output directory
#                and application id before it will do anything.
- description: create-project-does-not-over-ask
  vars:
    prompt: 'Create a Flutter app named my_store for organization com.example.mystore.'
  assert:
    # routing
    - type: skill-used
      value: 'vgv-ai-flutter-plugin:create-project'
      weight: 3
    # judged
    - type: llm-rubric
      value: >-
        The response does not interrogate the user for optional parameters such as a
        description, an output directory, or an application id. It proceeds with the
        name and organization it was given. Supplying its own value for an optional
        parameter satisfies this; so does handing the user a ready-to-run command,
        since no create tool is available in this environment. Only asking the user
        to supply more input before proceeding fails.

# -----------------------------------------------------------------------------
# 6  create-project-plans-dependency-install
# -----------------------------------------------------------------------------
# MEASURES       That the narrated plan scaffolds through Very Good CLI with an explicit
#                template and does not stop at creation — dependencies get installed.
# DISCRIMINATES  A bare model plans `flutter create my_store --org com.example` and
#                calls it done, leaving the install out entirely.
- description: create-project-plans-dependency-install
  vars:
    prompt: >-
      Create a Flutter app named my_store for organization com.example. Walk me through
      every step you will take.
  assert:
    # routing
    - type: skill-used
      value: 'vgv-ai-flutter-plugin:create-project'
      weight: 3
    # judged
    - type: llm-rubric
      value: >-
        The plan includes installing dependencies after the project is created, not
        just creating it.
    - type: llm-rubric
      value: >-
        The plan scaffolds through Very Good CLI with an explicit template name, rather
        than reaching for `flutter create`. Naming the CLI command is acceptable here
        because no MCP tool is available to call; using the Flutter SDK's own create
        command instead of Very Good CLI is what fails.

# -----------------------------------------------------------------------------
# 7  create-project-stays-out-of-existing-project-work  [negative control]
# -----------------------------------------------------------------------------
# MEASURES       That a one-field edit to an existing class leaves the skill dormant.
# DISCRIMINATES  create-project must not be invoked, and none of its vocabulary may
#                appear: no `very_good create`, no template name, no `--org`, and no
#                suggestion to scaffold a new project or package around the class.
- description: create-project-stays-out-of-existing-project-work
  vars:
    prompt: >-
      Here is my existing class:

      class ApiConfig {
        const ApiConfig({required this.baseUrl, required this.timeout});
        final String baseUrl;
        final Duration timeout;
      }

      Add a `retryCount` int field with a default of 3. Return only the updated class.
  assert:
    # routing
    - type: not-skill-used
      value: 'vgv-ai-flutter-plugin:create-project'
      weight: 3
    # mechanical
    - type: not-regex
      value: 'very_good create|dart_package|flutter_app|--org'
    # Task success is graded mechanically, not by the judge. The judge never sees the
    # prompt, so "did it edit the class" is unanswerable from the output alone.
    - type: regex
      value: 'this\.retryCount = 3'
    # judged
    - type: llm-rubric
      value: >-
        Judge only the text of the response, not whether the class compiles. It must not
        propose scaffolding a new project or package.
