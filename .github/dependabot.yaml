version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    labels:
      - "dependencies"
      - "no-auto-update"
  - package-ecosystem: "npm"
    directory: "/.github/tools"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "no-auto-update"
