name: evals

# Runs the eval cases for the skills a merge changed. Advisory, never a merge gate.
#
# The cost shape and the trade-offs behind it are in evals/README.md -> "Running in CI".
# Two things that only live here:
#
#   - `continue-on-error` is deliberate. Two unedited cases were measured moving between
#     runs, one across the pass/fail line, so a single run cannot gate a merge. Treat a red
#     case as a prompt to look, and confirm with `--runs 3` locally.
#   - Use the manual trigger for a full run before a release. That is ~100 cases and the
#     expensive one.

on:
  push:
    branches:
      - main
    paths:
      - 'skills/**'
      - 'evals/**'
  workflow_dispatch:
    inputs:
      scope:
        description: 'Which cases to run'
        type: choice
        default: changed-skills
        options:
          - changed-skills
          - all-skills
      include_baseline:
        description: 'Also run the no-plugin baseline arm (doubles the cost; only needed to re-check that cases discriminate)'
        type: boolean
        default: false
      runs:
        description: 'Runs per case per arm. 1 is cheapest; 3 separates a real failure from noise.'
        type: string
        default: '1'
      max_cost_usd:
        description: 'Cost ceiling in USD. The default covers the scoped post-merge run; a full two-arm run at --runs 3 is ~600 runs and needs far more, or it is cut short with partial results.'
        type: string
        default: '40'

# Never let two eval runs bill concurrently. Queue rather than cancel: a cancelled run has
# already spent most of its ceiling and leaves no aggregate-result.json behind.
concurrency:
  group: evals-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Pin the CLI. `claude plugin eval` reached general availability in 2.1.269, and an
  # unpinned install would let a CLI rollout read as a skill regression.
  CLAUDE_CODE_VERSION: '2.1.270'
  # Pin both models for the same reason. The agent under test and the judge move
  # independently, and either one drifting invalidates comparison with earlier runs.
  EVAL_MODEL: claude-sonnet-5
  EVAL_JUDGE_MODEL: claude-haiku-4-5

jobs:
  scope:
    name: 🔎 Scope
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.pick.outputs.tags }}
      run_evals: ${{ steps.pick.outputs.run_evals }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Pick the cases to run
        id: pick
        env:
          SCOPE: ${{ inputs.scope || 'changed-skills' }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail

          all_skills() {
            # A skill is eligible only if it has at least one case directory. Asking for a
            # tag that matches nothing is an error rather than a pass, but listing a skill
            # with no cases would still waste a job.
            # -exec dirname rather than -printf, which is GNU-only and would break
            # anyone running this script on macOS.
            find evals -mindepth 3 -maxdepth 3 -name case.yaml -exec dirname {} \; \
              | sed 's|^evals/||; s|/[^/]*$||' | sort -u
          }

          if [ "$SCOPE" = "all-skills" ]; then
            SKILLS=$(all_skills)
          else
            # On push, github.event.before is the previous main tip. On a manual run there
            # is no diff to take, so fall back to the last commit.
            BASE="${BEFORE:-}"
            if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
              BASE=$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)
            fi
            CHANGED=$(git diff --name-only "$BASE" "${{ github.sha }}" || true)

            # A skill is in scope if its SKILL.md, any of its references, or any of its own
            # cases changed. Editing a reference file changes what the skill teaches just as
            # much as editing SKILL.md does.
            SKILLS=$(
              {
                echo "$CHANGED" | { grep -oE '^skills/[^/]+/' || true; } | cut -d/ -f2
                echo "$CHANGED" | { grep -oE '^evals/[^_][^/]*/' || true; } | cut -d/ -f2
              } | sort -u | while read -r s; do
                    [ -n "$s" ] && [ -d "evals/$s" ] && echo "$s"
                  done
            )

            # A change to the shared fixture affects every case, so widen to everything.
            if echo "$CHANGED" | grep -qE '^evals/_fixture/'; then
              echo "fixture changed — widening to all skills"
              SKILLS=$(all_skills)
            fi
          fi

          if [ -z "$SKILLS" ]; then
            echo "No skill with eval cases changed. Nothing to run."
            echo "run_evals=false" >> "$GITHUB_OUTPUT"
            echo "tags=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Every case is tagged with its skill folder name, so `--tag a b c` selects
          # exactly the cases for the skills in scope. `--tag` keeps a case matching ANY
          # of the tags given.
          TAGS=$(echo "$SKILLS" | paste -sd' ' -)
          COUNT=$(echo "$SKILLS" | wc -l | tr -d ' ')

          echo "run_evals=true" >> "$GITHUB_OUTPUT"
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

          {
            echo "### Eval scope"
            echo
            echo "\`$COUNT\` skill(s) in scope: $(echo "$SKILLS" | paste -sd', ' -)"
            echo
            echo "Tags: \`$TAGS\`"
          } >> "$GITHUB_STEP_SUMMARY"

  run:
    name: 🧪 Run evals
    needs: scope
    if: needs.scope.outputs.run_evals == 'true'
    runs-on: ubuntu-latest
    # Advisory, never a merge gate. See the header comment.
    continue-on-error: true
    # 100 cases in one arm at --runs 1 measured ~35 minutes at -j 4. A full two-arm run at
    # --runs 3 is 600 runs and will not fit; raise this alongside max_cost_usd for one.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'

      - name: Install Claude Code
        run: |
          set -euo pipefail
          npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
          claude --version

      - name: Check the API key is present
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "${ANTHROPIC_API_KEY:-}" ]; then
            echo "::error::ANTHROPIC_API_KEY is not set. Locally these evals authenticate through the Claude Code session; CI has none, so the secret is required."
            exit 1
          fi

      - name: Run the scoped evals
        # Every `${{ }}` value arrives through env. Interpolating one into the script body
        # would let a workflow_dispatch input inject shell into a job holding the API key.
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          INCLUDE_BASELINE: ${{ inputs.include_baseline }}
          RUNS: ${{ inputs.runs || '1' }}
          MAX_COST: ${{ inputs.max_cost_usd || '40' }}
          TAGS: ${{ needs.scope.outputs.tags }}
        run: |
          set -euo pipefail
          ABLATION=none
          if [ "$INCLUDE_BASELINE" = "true" ]; then ABLATION=with-without; fi

          # Exit 1 means a case scored below the threshold, which is expected here: this
          # workflow is advisory and the summary step reports the outcome. Exit 2 means the
          # run was cut short, by an auth failure or by the cost ceiling. The ceiling case
          # still writes a partial document worth reading, so the gate is whether the
          # document exists, not the exit code.
          set +e
          claude plugin eval . \
            --trust-plugin --scaffold --no-publish \
            --runs "$RUNS" \
            --ablation "$ABLATION" \
            --threshold 0.8 \
            --model "$EVAL_MODEL" --judge-model "$EVAL_JUDGE_MODEL" \
            --max-cost-usd "$MAX_COST" \
            --output-dir evals/results/ci \
            -j 4 \
            --tag $TAGS 2>&1 | tee /tmp/eval.log
          CODE=${PIPESTATUS[0]}
          set -e
          if [ "$CODE" = "2" ] && [ ! -f evals/results/ci/aggregate-result.json ]; then
            echo "::error::The run was cut short before it produced any results: auth failed, or the cost ceiling was hit before the first case finished."
            exit 1
          fi

          test -f evals/results/ci/aggregate-result.json

      - name: Summarize
        # Always, so a partial run from the cost ceiling still reports what it measured.
        if: always()
        run: |
          set -uo pipefail
          RESULT=evals/results/ci/aggregate-result.json
          {
            echo "### Eval results"
            echo
            if [ -f "$RESULT" ] && [ "$(jq -r '.partial' "$RESULT")" = "true" ]; then
              echo "> **Partial run** (\`$(jq -r '.partialReason' "$RESULT")\`). Scores below are incomplete, so leave them out of any trend."
              echo
            fi
            echo "A run that timed out, hit the turn cap or was rate limited scores 0 with no failing"
            echo "grader, which reads like a content regression. Check the NOTES column before believing"
            echo "a red case, and confirm it locally with \`--runs 3\`."
            echo
            echo '```text'
            # 200, not 60: a full 100-case run prints more than 60 lines of table alone, and
            # a tail shorter than the table drops its header and its earliest rows.
            tail -n 200 /tmp/eval.log 2>/dev/null || echo "(no run output captured)"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload the run
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eval-run
          path: |
            evals/results/ci/aggregate-result.json
            evals/results/ci/report.html
          retention-days: 14
