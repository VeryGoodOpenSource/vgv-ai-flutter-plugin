name: evals

# Runs the eval cases for the skills a merge changed. Advisory, never a merge gate.

on:
  push:
    branches:
      - main
    paths:
      - 'skills/**'
      - 'evals/**'
  workflow_dispatch:
    inputs:
      scope:
        description: 'Which cases to run'
        type: choice
        default: changed-skills
        options:
          - changed-skills
          - all-skills
      include_baseline:
        description: 'Also run the no-plugin baseline arm (doubles the cost; only needed to re-check that cases discriminate)'
        type: boolean
        default: false
      runs:
        description: 'Runs per case per arm. 1 is cheapest; 3 separates a real failure from noise.'
        type: string
        default: '1'
      max_cost_usd:
        description: 'Cost ceiling in USD. Leave blank to size it from the scope: $5 for changed skills, $20 for all skills in one arm, $40 in both. Multiplied by runs.'
        type: string
        default: ''

concurrency:
  group: evals-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CLAUDE_CODE_VERSION: '2.1.270'
  EVAL_MODEL: claude-sonnet-5
  EVAL_JUDGE_MODEL: claude-sonnet-5

jobs:
  scope:
    name: 🔎 Scope
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.pick.outputs.tags }}
      run_evals: ${{ steps.pick.outputs.run_evals }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Pick the cases to run
        id: pick
        env:
          SCOPE: ${{ inputs.scope || 'changed-skills' }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail

          all_skills() {
            find evals -mindepth 3 -maxdepth 3 -name case.yaml -exec dirname {} \; \
              | sed 's|^evals/||; s|/[^/]*$||' | sort -u
          }

          if [ "$SCOPE" = "all-skills" ]; then
            SKILLS=$(all_skills)
          else
            BASE="${BEFORE:-}"
            if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
              BASE=$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)
            fi
            CHANGED=$(git diff --name-only "$BASE" "${{ github.sha }}" || true)

            SKILLS=$(
              {
                echo "$CHANGED" | { grep -oE '^skills/[^/]+/' || true; } | cut -d/ -f2
                echo "$CHANGED" | { grep -oE '^evals/[^_][^/]*/' || true; } | cut -d/ -f2
              } | sort -u | while read -r s; do
                    [ -n "$s" ] && [ -d "evals/$s" ] && echo "$s"
                  done
            )

            if echo "$CHANGED" | grep -qE '^evals/_fixture/'; then
              echo "fixture changed — widening to all skills"
              SKILLS=$(all_skills)
            fi
          fi

          if [ -z "$SKILLS" ]; then
            echo "No skill with eval cases changed. Nothing to run."
            echo "run_evals=false" >> "$GITHUB_OUTPUT"
            echo "tags=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          TAGS=$(echo "$SKILLS" | paste -sd' ' -)
          COUNT=$(echo "$SKILLS" | wc -l | tr -d ' ')

          echo "run_evals=true" >> "$GITHUB_OUTPUT"
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

          {
            echo "### Eval scope"
            echo
            echo "\`$COUNT\` skill(s) in scope: $(echo "$SKILLS" | paste -sd', ' -)"
            echo
            echo "Tags: \`$TAGS\`"
          } >> "$GITHUB_STEP_SUMMARY"

  run:
    name: 🧪 Run evals
    needs: scope
    if: needs.scope.outputs.run_evals == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'

      - name: Install Claude Code
        run: |
          set -euo pipefail
          npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
          claude --version

      - name: Check the API key is present
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "${ANTHROPIC_API_KEY:-}" ]; then
            echo "::error::ANTHROPIC_API_KEY is not set. Locally these evals authenticate through the Claude Code session; CI has none, so the secret is required."
            exit 1
          fi

      - name: Run the scoped evals
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          INCLUDE_BASELINE: ${{ inputs.include_baseline }}
          RUNS: ${{ inputs.runs || '1' }}
          MAX_COST: ${{ inputs.max_cost_usd }}
          SCOPE: ${{ inputs.scope || 'changed-skills' }}
          TAGS: ${{ needs.scope.outputs.tags }}
        run: |
          set -euo pipefail
          ABLATION=none
          if [ "$INCLUDE_BASELINE" = "true" ]; then ABLATION=with-without; fi

          if [ -z "$MAX_COST" ]; then
            if [ "$SCOPE" = "all-skills" ]; then MAX_COST=20; else MAX_COST=5; fi
            if [ "$ABLATION" = "with-without" ]; then MAX_COST=$(( MAX_COST * 2 )); fi
            MAX_COST=$(( MAX_COST * RUNS ))
          fi
          echo "Cost ceiling: \$$MAX_COST (scope=$SCOPE ablation=$ABLATION runs=$RUNS)"

          set +e
          claude plugin eval . \
            --trust-plugin --scaffold --no-publish \
            --runs "$RUNS" \
            --ablation "$ABLATION" \
            --threshold 0.8 \
            --model "$EVAL_MODEL" --judge-model "$EVAL_JUDGE_MODEL" \
            --max-cost-usd "$MAX_COST" \
            --output-dir evals/results/ci \
            -j 4 \
            --tag $TAGS 2>&1 | tee /tmp/eval.log
          CODE=${PIPESTATUS[0]}
          set -e
          if [ "$CODE" = "2" ] && [ ! -f evals/results/ci/aggregate-result.json ]; then
            echo "::error::The run was cut short before it produced any results: auth failed, or the cost ceiling was hit before the first case finished."
            exit 1
          fi

          test -f evals/results/ci/aggregate-result.json

      - name: Summarize
        if: always()
        run: |
          set -uo pipefail
          RESULT=evals/results/ci/aggregate-result.json
          {
            echo "### Eval results"
            echo
            if [ -f "$RESULT" ] && [ "$(jq -r '.partial' "$RESULT")" = "true" ]; then
              echo "> **Partial run** (\`$(jq -r '.partialReason' "$RESULT")\`). Scores below are incomplete, so leave them out of any trend."
              echo
            fi
            echo "A run that timed out, hit the turn cap or was rate limited scores 0 with no failing"
            echo "grader, which reads like a content regression. Check the NOTES column before believing"
            echo "a red case, and confirm it locally with \`--runs 3\`."
            echo
            echo '```text'
            tail -n 200 /tmp/eval.log 2>/dev/null || echo "(no run output captured)"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload the run
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eval-run
          path: |
            evals/results/ci/aggregate-result.json
            evals/results/ci/report.html
          retention-days: 14
