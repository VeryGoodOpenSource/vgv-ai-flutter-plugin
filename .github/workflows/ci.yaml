name: ci

on:
  pull_request:
    branches:
      - main

jobs:
  markdown:
    name: 📝 Markdown Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # `evals/**/prompt.md` is excluded from both linters on purpose. A prompt body is
      # verbatim model input, not prose: it carries pasted Dart, so markdownlint reads
      # `_client` as an emphasis marker and cspell reads identifiers as misspellings.
      # Editing one to satisfy a linter would change what the model is asked, which is
      # exactly what the suite must not do.
      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@v24.2.0
        with:
          globs: |
            **/*.md
            !CHANGELOG.md
            !evals/**/prompt.md
          config: 'config/custom.markdownlint.jsonc'
  spelling:
    name: ✍️ Spelling Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Spell Check Code
        uses: streetsidesoftware/cspell-action@v9
        with:
          files: |
            **/*.md
            **/*.yml
            **/*.yaml
            !CHANGELOG.md
            !evals/**/prompt.md
          config: 'config/cspell.json'
  list-skills:
    name: 🔎 List Skills
    runs-on: ubuntu-latest
    outputs:
      skills: ${{ steps.list-skills.outputs.skills }}
    steps:
      - uses: actions/checkout@v7
      - name: List all skills
        id: list-skills
        run: |
          SKILLS=$(find -L skills -name SKILL.md -type f | \
            xargs -I {} dirname {} | \
            sort -u | \
            jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "skills=$SKILLS" >> "$GITHUB_OUTPUT"
          echo "Skills: $SKILLS"
  validate-skills:
    name: 🔍 Validate Skills
    needs: list-skills
    if: needs.list-skills.outputs.skills != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        skill: ${{ fromJson(needs.list-skills.outputs.skills) }}
    steps:
      - uses: actions/checkout@v7
      - name: Validate ${{ matrix.skill }}
        id: validate
        uses: Flash-Brew-Digital/validate-skill@v1
        with:
          path: ${{ matrix.skill }}
          validate-references: 'true'
          fail-on-warning: 'true'
          ignore-rules: 'unknown-field'
      - name: Check results
        if: always()
        run: |
          echo "Valid: ${{ steps.validate.outputs.valid }}"
          echo "Errors: ${{ steps.validate.outputs.errors }}"
          echo "Warnings: ${{ steps.validate.outputs.warnings }}"
  plugin-validate:
    name: 📦 Plugin Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate Plugin
        run: claude plugin validate .
  script-tests:
    name: 🛡️ Script Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Read-only git hook tests
        run: bash hooks/scripts/allow-readonly-git_test.sh
      - name: Block CLI workarounds hook tests
        run: bash hooks/scripts/block-cli-workarounds_test.sh
