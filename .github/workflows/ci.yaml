name: ci

on:
  pull_request:
    branches:
      - main

jobs:
  markdown:
    name: 📝 Markdown Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@v24.2.0
        with:
          globs: |
            **/*.md
            !CHANGELOG.md
          config: 'config/custom.markdownlint.jsonc'
  spelling:
    name: ✍️ Spelling Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Spell Check Code
        uses: streetsidesoftware/cspell-action@v9
        with:
          files: |
            **/*.md
            **/*.yml
            **/*.yaml
            !CHANGELOG.md
          config: 'config/cspell.json'
  skills-lint:
    name: 🔍 Skills Lint
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/skills_lint.yml@v1.21.0
    with:
      skills_directories: 'skills'
  plugin-validate:
    name: 📦 Plugin Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate Plugin
        run: claude plugin validate .
  script-tests:
    name: 🛡️ Script Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Read-only git hook tests
        run: bash hooks/scripts/allow-readonly-git_test.sh
      - name: Block CLI workarounds hook tests
        run: bash hooks/scripts/block-cli-workarounds_test.sh
