name: ci

on:
  pull_request:
    branches:
      - main

jobs:
  markdown:
    name: 📝 Markdown Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@v24.2.0
        with:
          globs: |
            **/*.md
            !CHANGELOG.md
          config: 'config/custom.markdownlint.jsonc'
  spelling:
    name: ✍️ Spelling Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Spell Check Code
        uses: streetsidesoftware/cspell-action@v9
        with:
          files: |
            **/*.md
            **/*.yml
            **/*.yaml
            !CHANGELOG.md
          config: 'config/cspell.json'
  list-skills:
    name: 🔎 List Skills
    runs-on: ubuntu-latest
    outputs:
      skills: ${{ steps.list-skills.outputs.skills }}
    steps:
      - uses: actions/checkout@v7
      - name: List all skills
        id: list-skills
        run: |
          SKILLS=$(find -L skills -name SKILL.md -type f | \
            xargs -I {} dirname {} | \
            sort -u | \
            jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "skills=$SKILLS" >> "$GITHUB_OUTPUT"
          echo "Skills: $SKILLS"
  validate-skills:
    name: 🔍 Validate Skills
    needs: list-skills
    if: needs.list-skills.outputs.skills != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        skill: ${{ fromJson(needs.list-skills.outputs.skills) }}
    steps:
      - uses: actions/checkout@v7
      - name: Validate ${{ matrix.skill }}
        id: validate
        uses: Flash-Brew-Digital/validate-skill@v1
        with:
          path: ${{ matrix.skill }}
          validate-references: 'true'
          fail-on-warning: 'true'
          ignore-rules: 'unknown-field'
      - name: Check results
        if: always()
        run: |
          echo "Valid: ${{ steps.validate.outputs.valid }}"
          echo "Errors: ${{ steps.validate.outputs.errors }}"
          echo "Warnings: ${{ steps.validate.outputs.warnings }}"
  skills-install:
    name: 📥 Skills Install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install this tree with the skills CLI
        env:
          DISABLE_TELEMETRY: '1'
          DO_NOT_TRACK: '1'
        run: |
          mkdir -p "$RUNNER_TEMP/skills-install"
          cd "$RUNNER_TEMP/skills-install"
          npx --yes skills@latest add "$GITHUB_WORKSPACE" --all
      - name: Verify every skill installed into .agents/skills
        run: |
          target="$RUNNER_TEMP/skills-install/.agents/skills"
          expected=$(find -L skills -name SKILL.md -type f | \
            xargs -n1 dirname | xargs -n1 basename | sort -u)
          actual=$(ls -1 "$target" | sort -u)
          if [ "$expected" != "$actual" ]; then
            echo "::error::skills CLI discovery does not match skills/ in this tree."
            echo "A skill the CLI cannot see is a skill nobody can install with npx skills."
            diff <(echo "$expected") <(echo "$actual") || true
            exit 1
          fi
          for skill in $expected; do
            if ! diff -r "skills/$skill" "$target/$skill" >/dev/null; then
              echo "::error::$skill was rewritten on install and no longer matches the source."
              diff -r "skills/$skill" "$target/$skill" || true
              exit 1
            fi
          done
          echo "$(echo "$expected" | wc -l) skills installed byte-identical into .agents/skills/"
  plugin-validate:
    name: 📦 Plugin Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate Plugin
        run: claude plugin validate .
  script-tests:
    name: 🛡️ Script Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Read-only git hook tests
        run: bash hooks/scripts/allow-readonly-git_test.sh
      - name: Block CLI workarounds hook tests
        run: bash hooks/scripts/block-cli-workarounds_test.sh
