name: ci

on:
  pull_request:
    branches:
      - main

jobs:
  markdown:
    name: 📝 Markdown Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@v24.2.0
        with:
          globs: |
            **/*.md
            !CHANGELOG.md
          config: 'config/custom.markdownlint.jsonc'
  spelling:
    name: ✍️ Spelling Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Spell Check Code
        uses: streetsidesoftware/cspell-action@v9
        with:
          files: |
            **/*.md
            **/*.yml
            **/*.yaml
            !CHANGELOG.md
          config: 'config/cspell.json'
  list-skills:
    name: 🔎 List Skills
    runs-on: ubuntu-latest
    outputs:
      skills: ${{ steps.list-skills.outputs.skills }}
    steps:
      - uses: actions/checkout@v7
      - name: List all skills
        id: list-skills
        run: |
          SKILLS=$(find -L skills -name SKILL.md -type f | \
            xargs -I {} dirname {} | \
            sort -u | \
            jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "skills=$SKILLS" >> "$GITHUB_OUTPUT"
          echo "Skills: $SKILLS"
  validate-skills:
    name: 🔍 Validate Skills
    needs: list-skills
    if: needs.list-skills.outputs.skills != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        skill: ${{ fromJson(needs.list-skills.outputs.skills) }}
    steps:
      - uses: actions/checkout@v7
      - name: Validate ${{ matrix.skill }}
        id: validate
        uses: Flash-Brew-Digital/validate-skill@v1
        with:
          path: ${{ matrix.skill }}
          validate-references: 'true'
          fail-on-warning: 'true'
          ignore-rules: 'unknown-field'
      - name: Check results
        if: always()
        run: |
          echo "Valid: ${{ steps.validate.outputs.valid }}"
          echo "Errors: ${{ steps.validate.outputs.errors }}"
          echo "Warnings: ${{ steps.validate.outputs.warnings }}"
  plugin-validate:
    name: 📦 Plugin Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate Plugin
        run: claude plugin validate .
  script-tests:
    name: 🛡️ Script Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Read-only git hook tests
        run: bash hooks/scripts/allow-readonly-git_test.sh
      - name: Block CLI workarounds hook tests
        run: bash hooks/scripts/block-cli-workarounds_test.sh
      - name: Gemini CLI config tests
        run: bash hooks/scripts/gemini-config_test.sh
  gemini-loader:
    name: ♊ Gemini CLI Loader
    # Asserts the plugin actually loads in Gemini CLI: all 15 skills discovered
    # from .agents/skills, the flutter-reviewer subagent accepted by Gemini's
    # strict agent schema, and .gemini/settings.json hooks registered under
    # event names Gemini fires. No credentials are used and no model is called.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.22.0'
      - name: Install Gemini CLI
        run: npm install -g @google/gemini-cli
      - name: Build a probe workspace
        # Mirrors how a consumer installs: skills land in .agents/skills (the
        # Agent Skills standard path Gemini reads), and .gemini/ carries the
        # subagent plus the hook and MCP wiring. mcpServers is stripped because
        # this job asserts loading, not tool execution, and `dart` / `very_good`
        # are not on the runner.
        run: |
          set -euo pipefail
          WS="$RUNNER_TEMP/gemini-probe"
          mkdir -p "$WS/.agents/skills" "$WS/.gemini"
          cp -R skills/. "$WS/.agents/skills/"
          cp -R .gemini/agents "$WS/.gemini/agents"
          cp -R hooks "$WS/hooks"
          jq 'del(.mcpServers)' .gemini/settings.json > "$WS/.gemini/settings.json"
          # Folder trust is on by default and silently disables workspace
          # skills, agents, and hooks in a non-interactive session.
          mkdir -p "$HOME/.gemini"
          echo '{"security":{"folderTrust":{"enabled":false}}}' > "$HOME/.gemini/settings.json"
          echo "WS=$WS" >> "$GITHUB_ENV"
      - name: Assert every skill loads
        run: |
          set -euo pipefail
          cd "$WS"
          gemini skills list | tee "$RUNNER_TEMP/skills.txt"
          expected=$(find -L "$GITHUB_WORKSPACE/skills" -name SKILL.md -type f |
            xargs -I {} dirname {} | xargs -n1 basename | sort)
          for skill in $expected; do
            if ! grep -qE "^${skill} \[Enabled\]" "$RUNNER_TEMP/skills.txt"; then
              echo "::error::skill '${skill}' did not load in Gemini CLI"
              exit 1
            fi
          done
          loaded=$(grep -cE '^\S+ \[Enabled\]' "$RUNNER_TEMP/skills.txt")
          count=$(echo "$expected" | wc -l | tr -d ' ')
          if [ "$loaded" -ne "$count" ]; then
            echo "::error::expected ${count} skills to load, Gemini CLI loaded ${loaded}"
            exit 1
          fi
          echo "All ${count} skills loaded."
      - name: Assert the subagent and hooks load
        # A headless run reports agent and hook registration before it reaches
        # the model, so an unreachable base URL is enough to read the verdict
        # without a key, a network call, or a billed request.
        run: |
          set -uo pipefail
          cd "$WS"
          GEMINI_API_KEY=unused GEMINI_BASE_URL=http://127.0.0.1:1 \
            gemini -p "noop" > "$RUNNER_TEMP/probe.txt" 2>&1 || true
          cat "$RUNNER_TEMP/probe.txt"
          status=0
          if grep -q "Agent loading error" "$RUNNER_TEMP/probe.txt"; then
            echo "::error::Gemini CLI rejected a subagent in .gemini/agents"
            status=1
          fi
          if grep -q "Invalid hook event name" "$RUNNER_TEMP/probe.txt"; then
            echo "::error::.gemini/settings.json declares a hook event Gemini CLI does not fire"
            status=1
          fi
          if grep -qE "Hook\(s\) \[.*\] failed" "$RUNNER_TEMP/probe.txt"; then
            echo "::error::a hook declared in .gemini/settings.json failed to execute"
            status=1
          fi
          exit "$status"
