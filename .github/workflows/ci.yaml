name: ci

on:
  pull_request:
    branches:
      - main

env:
  CLAUDE_CODE_VERSION: '2.1.270'

jobs:
  markdown:
    name: 📝 Markdown Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@v24.2.0
        with:
          globs: |
            **/*.md
            !CHANGELOG.md
            !evals/**/prompt.md
          config: 'config/custom.markdownlint.jsonc'
  spelling:
    name: ✍️ Spelling Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Spell Check Code
        uses: streetsidesoftware/cspell-action@v9
        with:
          files: |
            **/*.md
            **/*.yml
            **/*.yaml
            !CHANGELOG.md
            !evals/**/prompt.md
          config: 'config/cspell.json'
  skills-lint:
    name: 🔍 Skills Lint
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/skills_lint.yml@v1.21.0
    with:
      skills_directories: 'skills'
  plugin-validate:
    name: 📦 Plugin Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Claude Code
        run: npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
      - name: Validate Plugin
        run: claude plugin validate .
      - name: Eval fixtures are symlinks
        run: |
          set -euo pipefail
          status=0
          while IFS= read -r dir; do
            f="$dir/fixture.sh"
            if [ ! -L "$f" ]; then
              echo "::error::$f is missing or is a real file, not a symlink"
              status=1
            elif [ "$(readlink "$f")" != "../../_fixture/fixture.sh" ]; then
              echo "::error::$f points at '$(readlink "$f")', expected ../../_fixture/fixture.sh"
              status=1
            elif [ ! -e "$f" ]; then
              echo "::error::$f is a dangling symlink"
              status=1
            fi
          done < <(find evals -mindepth 3 -maxdepth 3 -name case.yaml -exec dirname {} \;)
          exit $status
  script-tests:
    name: 🛡️ Script Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Read-only git hook tests
        run: bash hooks/scripts/allow-readonly-git_test.sh
      - name: Block CLI workarounds hook tests
        run: bash hooks/scripts/block-cli-workarounds_test.sh
